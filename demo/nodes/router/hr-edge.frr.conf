! HR kenar yönlendiricisi — kontrol düzlemi ile WAN bacağı arasındaki geçiş.
! Müşteri ağına giden her şey buradan çıkar; gelen bağlantı kabul edilmez.
frr version 10.2
frr defaults traditional
hostname hr-edge
log stdout
service integrated-vtysh-config
!
interface eth1
 description HR kontrol duzlemi bacagi
 ip address 10.10.0.254/24
!
interface eth2
 description WAN bacagi - musteriye gecis
 ip address 100.64.0.1/30
!
ip forwarding
!
ip route 172.31.0.0/29 100.64.0.2
ip route 192.168.0.0/16 100.64.0.2
!
line vty
!
