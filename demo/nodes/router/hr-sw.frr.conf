! HR çekirdek anahtarı — kontrol düzlemi bacağının L2/L3 buluşma noktası.
! Tüm HR bileşenleri br-core köprüsüne bağlanır; ağ geçidi 10.10.0.1.
frr version 10.2
frr defaults traditional
hostname hr-sw
log stdout
service integrated-vtysh-config
!
interface br-core
 description HR kontrol duzlemi - 10.10.0.0/24
 ip address 10.10.0.1/24
!
ip forwarding
!
! Müşteri ağlarına giden yol kenar yönlendirici üzerinden
ip route 100.64.0.0/30 10.10.0.254
ip route 172.31.0.0/29 10.10.0.254
ip route 192.168.0.0/16 10.10.0.254
!
line vty
!
