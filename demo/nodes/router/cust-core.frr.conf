! Müşteri çekirdek anahtarı — üç VLAN'ın L3 ağ geçidi.
! Her VLAN ayrı bir köprü arayüzüdür; böylece sunucu, kullanıcı ve yönetim
! trafiği gerçekten ayrı yayın alanlarında akar.
frr version 10.2
frr defaults traditional
hostname cust-core
log stdout
service integrated-vtysh-config
!
interface eth1
 description DMZ bacagi - guvenlik duvarina
 ip address 172.31.0.2/29
!
interface br-mgmt
 description VLAN 10 - yonetim (site relay, cihaz yonetim arayuzleri)
 ip address 192.168.10.1/24
!
interface br-srv
 description VLAN 20 - sunucular (ajan calistiran)
 ip address 192.168.20.1/24
!
interface br-usr
 description VLAN 30 - kullanicilar (ajan calistiran)
 ip address 192.168.30.1/24
!
ip forwarding
!
ip route 0.0.0.0/0 172.31.0.1
!
line vty
!
