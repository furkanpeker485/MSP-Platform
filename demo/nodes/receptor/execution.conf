# Müşteri sahası — YÜRÜTME düğümü (site relay üzerinde).
#
# Kritik: burada tcp-listener YOK. Düğüm gelen bağlantı dinlemez,
# bağlantıyı kendisi hop düğümüne doğru kurar. AWX tarafında bu düğüm
# listener_port: null ve peers_from_control_nodes: false ile kaydedilir.
# Müşterinin güvenlik duvarında HR için tek bir gelen kural açılmaz.
- node:
    id: relay-acme

- log-level: info

- tcp-peer:
    address: 10.10.0.12:27199
    redial: true

- control-service:
    service: control
    filename: /tmp/receptor.sock

- work-command:
    worktype: ansible-runner
    command: echo
    params: "ansible-runner yer tutucu"
    allowruntimeparams: true
