#!/usr/sbin/nft -f
# Müşteri güvenlik duvarı — B şeridinin klasik hedefi.
# Bu düğüme ajan KURULAMAZ; kurallar yalnız dışarıdan SSH ile basılır.
#
# Tasarımın özü burada görünür: içeriden dışarı serbest, dışarıdan içeri KAPALI.
# Site relay ve ajanlar bağlantıyı kendileri kurduğu için tek bir gelen kural gerekmez.

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    iif "lo" accept
    ip protocol icmp accept

    # Yönetim erişimi yalnız müşteri yönetim VLAN'ından ve HR kontrol düzleminden
    ip saddr 192.168.10.0/24 tcp dport 22 accept comment "yonetim VLAN'indan SSH"
    ip saddr 10.10.0.0/24    tcp dport 22 accept comment "HR kontrol duzleminden SSH"
  }

  chain forward {
    type filter hook forward priority filter; policy drop;

    ct state established,related accept

    # İÇERİDEN DIŞARI: relay ve ajanlar HR'a kendileri bağlanır
    ip saddr 192.168.0.0/16 ip daddr 10.10.0.0/24 tcp dport { 443, 8000, 10051, 27199 } accept \
      comment "musteri agindan HR kontrol duzlemine giden baglantilar"
    ip saddr 192.168.0.0/16 ip daddr 0.0.0.0/0 ct state new accept \
      comment "internete cikis"

    # VLAN'lar arası: sunucu ve kullanıcı VLAN'ları yönetim VLAN'ındaki relay'e ulaşır
    ip saddr 192.168.20.0/24 ip daddr 192.168.10.10 tcp dport 8080 accept
    ip saddr 192.168.30.0/24 ip daddr 192.168.10.10 tcp dport 8080 accept

    # DIŞARIDAN İÇERİ: kural YOK. Bilinçli boşluk.
    # HR tarafı müşteri ağına hiçbir zaman bağlantı başlatmaz.
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}

table ip nat {
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    # Müşteri ağı WAN'a çıkarken kaynak adres çevrimi
    ip saddr 192.168.0.0/16 oifname "eth1" masquerade
  }
}
