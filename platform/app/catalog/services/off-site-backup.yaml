# Bu dosya tasarım belgesinden üretilmiştir; hizmet kimliği sitedeki kimlikle aynıdır.
id: off-site-backup
name: "Off-site Backup"
area: "Backup & Business Continuity"
tier: "Enterprise"
lane: C
lanes: [B, C, D, E]
plain: "Yedeğin ikinci bir kopyasının başka bir lokasyonda tutulması. Yangın, su baskını veya hırsızlıkta veri yine de elinizde olur."
executor: "REST (web tabanlı arayüz) ile Veeam backup copy işi + Cloud Connect; tenant repo ve kotası için HRC (Hisar Research'ün kendi bulutu) API (uygulama arayüzü)"
automation_grade: FULL
secret_stores: ["ansible-vault", "n8n-credentials"]
requires: [envanter-yonetim-sistemi]
health_check: "En yeni offsite noktası yerel zincirin gerisine kopyalama RPO'sunu (kabul edilebilir veri kaybı) aşacak kadar düşerse Zabbix alarm verir"
gotcha: "İlk tohumlama WAN üzerinden haftalar sürer; tohumlanmış kopya olmadan iş 1. günden alarm verir ve susturulur."
tasks:
  - id: vault-intake
    lane: D
    action: vault.store_access
    description: "Erişim bilgilerini kasaya yaz; parola koda gömülmez."
    params: {"store": ["ansible-vault", "n8n-credentials"]}
  - id: step-01
    lane: C
    action: cloud.configure
    description: "HRC API: Cloud Connect tenant'ı, repo kotası, saha başına bant genişliği kısıtı oluştur"
  - id: step-02
    lane: C
    action: veeam.configure
    description: "Veeam REST: kendi saklama süresi olan GFS (uzun vadeli yedek saklama düzeni) backup copy işini bulut repoya kur"
  - id: step-03
    lane: B
    action: awx.launch
    description: "Ansible site relay'de WAN (internet hattı) hızlandırıcıyı ve kısıtlama penceresini yapılandırır"
  - id: step-04
    lane: D
    action: netbox.ensure_device
    description: "NetBox'ta offsite hedef/saklama alanları; Zabbix kopyalama gecikme trigger'ı"
  - id: step-05
    lane: E
    action: n8n.schedule
    description: "n8n korunan iş yükü başına aylık 3-2-1 uyum raporu"
    params: {"workflow": "scheduled_generic", "cron": "0 6 1 * *"}
teardown:
  - id: revoke-access
    lane: D
    action: vault.revoke
    description: "Kasa anahtarlarını iptal et ve değiştir."
  - id: netbox-decommission
    lane: D
    action: netbox.decommission
    description: "Envanter kaydını hizmetten çıkarıldı olarak işaretle."
