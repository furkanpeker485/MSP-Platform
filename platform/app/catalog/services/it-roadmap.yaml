# Bu dosya tasarım belgesinden üretilmiştir; hizmet kimliği sitedeki kimlikle aynıdır.
id: it-roadmap
name: "IT Roadmap"
area: "IT Consulting & Audit"
tier: "Proje"
lane: F
lanes: [F, E, D]
plain: "Önümüzdeki yıllarda neyin yenilenmesi, neye yatırım yapılması gerektiğinin bütçeyle birlikte yol haritası."
executor: "Danışman; girdiler NetBox yaşam döngüsü, kapasite trendi ve denetim bulguları"
automation_grade: HUMAN
secret_stores: ["n8n-credentials"]
requires: [envanter-yonetim-sistemi]
health_check: "Yol haritasındaki her kalemin NetBox veya kapasite verisinden bir dayanağı olmalı"
gotcha: "Veriden değil toplantıdan doğan yol haritası bir sonraki bütçe döneminde savunulamaz."
tasks:
  - id: vault-intake
    lane: D
    action: vault.store_access
    description: "Erişim bilgilerini kasaya yaz; parola koda gömülmez."
    params: {"store": ["n8n-credentials"]}
  - id: step-01
    lane: D
    action: netbox.ensure_device
    description: "Yaşam döngüsü, garanti ve EOL (kullanım ömrü sonu) alanlarını NetBox'ta güncel ve dolu hâle getir"
  - id: step-02
    lane: E
    action: n8n.schedule
    description: "Kapasite trendi ve yenileme kohortu raporlarını çeyreklik olarak zamanla"
    params: {"workflow": "scheduled_generic", "cron": "0 6 1 * *"}
  - id: step-03
    lane: F
    action: human.work_order
    description: "Danışman yatırım ve dönüşüm yol haritasını bütçe takvimiyle birlikte üretir"
    params: {"queue": "saha"}
  - id: step-04
    lane: D
    action: ticketing.ensure_queue
    description: "Yol haritası kalemlerini ticket sisteminde izlenebilir iş kalemlerine bağla"
teardown:
  - id: revoke-access
    lane: D
    action: vault.revoke
    description: "Kasa anahtarlarını iptal et ve değiştir."
  - id: netbox-decommission
    lane: D
    action: netbox.decommission
    description: "Envanter kaydını hizmetten çıkarıldı olarak işaretle."
