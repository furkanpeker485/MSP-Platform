# Bu dosya tasarım belgesinden üretilmiştir; hizmet kimliği sitedeki kimlikle aynıdır.
id: cloud-migration
name: "Cloud Migration"
area: "Cloud Management"
tier: "Proje"
lane: C
lanes: [C, F, B, A, E]
plain: "Sunucularınızın ve verilerinizin buluta, iş neredeyse hiç durmadan taşınması."
executor: "Veeam/HRC replikasyon API'si (uygulama arayüzü) + hipervizör API'si; kesim orkestrasyonu n8n"
automation_grade: ASSISTED
secret_stores: [".env", "ansible-vault", "n8n-credentials"]
requires: [envanter-yonetim-sistemi]
health_check: "Replika gecikmesi RPO (kabul edilebilir veri kaybı) altında; kesim öncesi otomatik açılış testi (vLab/SureBackup) yeşil"
gotcha: "RTO'yu (ayağa kalkma süresi) replikasyon değil DNS TTL (önbellek süresi), re-IP ve lisans yeniden aktivasyonu patlatır; hepsini önceden düşürün."
tasks:
  - id: vault-intake
    lane: D
    action: vault.store_access
    description: "Erişim bilgilerini kasaya yaz; parola koda gömülmez."
    params: {"store": [".env", "ansible-vault", "n8n-credentials"]}
  - id: step-01
    lane: C
    action: cloud.configure
    description: "HRC (Hisar Research'ün kendi bulutu)/hedef bulutta tenant, ağ ve kaynak planını API ile oluştur"
  - id: step-02
    lane: C
    action: cloud.configure
    description: "Replikasyon/taşıma işlerini kur ve ilk tam senkronu tohumla"
  - id: step-03
    lane: B
    action: awx.launch
    description: "Hedefte ağ, rota ve firewall kurallarını uygulanmamış şablon olarak hazırla"
  - id: step-04
    lane: A
    action: agent.converge
    description: "Taşınan sunuculara HR (Hisar Research) agent'ı cloud-init/altın imaj ile tohumla"
  - id: step-05
    lane: E
    action: n8n.schedule
    description: "n8n kesim koşusu: son senkron, güç kapatma, re-IP, DNS (alan adı çözümleme), kabul testi"
    params: {"workflow": "scheduled_generic", "cron": "0 6 1 * *"}
teardown:
  - id: revoke-access
    lane: D
    action: vault.revoke
    description: "Kasa anahtarlarını iptal et ve değiştir."
  - id: netbox-decommission
    lane: D
    action: netbox.decommission
    description: "Envanter kaydını hizmetten çıkarıldı olarak işaretle."
