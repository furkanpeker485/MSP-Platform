# Bu dosya tasarım belgesinden üretilmiştir; hizmet kimliği sitedeki kimlikle aynıdır.
id: firewall-installation
name: "Firewall Installation"
area: "On-Site & Proje Hizmetleri"
tier: "Proje"
lane: F
lanes: [F, B, D]
plain: "Güvenlik duvarı cihazının yerinde kurulumu, lisanslanması ve devreye alınması."
executor: "Saha ekibi cihazı devreye alır; relay'den fortinet.fortios/panos ile baseline"
automation_grade: HUMAN
secret_stores: ["ansible-vault", "n8n-credentials"]
requires: [envanter-yonetim-sistemi]
health_check: "HA senkron durumu, SIEM log kaynağı heartbeat'i ve gecelik config yedeği yeşil"
gotcha: "Lisans aktivasyonu üretici portalında müşteri hesabına bağlanmazsa yenilemede cihaz özelliklerini kaybeder."
tasks:
  - id: vault-intake
    lane: D
    action: vault.store_access
    description: "Erişim bilgilerini kasaya yaz; parola koda gömülmez."
    params: {"store": ["ansible-vault", "n8n-credentials"]}
  - id: step-01
    lane: D
    action: netbox.ensure_device
    description: "NetBox'ta cihaz, HA (yedekli çalışma) çifti ve WAN (internet hattı) devre kaydını oluştur"
  - id: step-02
    lane: F
    action: human.work_order
    description: "Cihazı rack'e al, kablola, lisansı aktive et ve ilk yönetim erişimini kur"
    params: {"queue": "saha"}
  - id: step-03
    lane: B
    action: awx.launch
    description: "Baseline'ı bas: admin MFA (çok adımlı doğrulama), yönetim ACL'i (erişim izin listesi), NTP (saat eşitleme), loglama, HA senkronu"
  - id: step-04
    lane: D
    action: zabbix.ensure_host
    description: "Zabbix host'u + SIEM (güvenlik kayıt merkezi) log kaynağını aç, devreye alma kabulünü kaydet"
teardown:
  - id: revoke-access
    lane: D
    action: vault.revoke
    description: "Kasa anahtarlarını iptal et ve değiştir."
  - id: netbox-decommission
    lane: D
    action: netbox.decommission
    description: "Envanter kaydını hizmetten çıkarıldı olarak işaretle."
