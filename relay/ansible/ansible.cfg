[defaults]
inventory = inventory/netbox.yml
roles_path = roles
host_key_checking = True
stdout_callback = yaml
# Parolalar playbook'un içinde durmaz; ansible-vault'tan çözülür.
vault_password_file = /var/lib/receptor/vault-pass
retry_files_enabled = False

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes
