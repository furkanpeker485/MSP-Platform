# Site Relay yığını. Hiçbiri gelen bağlantı için dış dünyaya açılmaz;
# yalnız müşterinin yerel ağına ve giden 443/27199'a ihtiyaç duyar.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    networks: [relay]
    restart: unless-stopped

  relay-api:
    build: ./relay_api
    env_file: [.env]
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    ports:
      - "127.0.0.1:8080:8080"   # yalnız yerel ağ; internete açılmaz
    depends_on: [redis]
    networks: [relay]
    restart: unless-stopped

  receptor:
    image: quay.io/ansible/receptor:latest
    volumes:
      - ./receptor/receptor.conf:/etc/receptor/receptor.conf:ro
      - receptor-data:/var/lib/receptor
    networks: [relay]
    restart: unless-stopped

  zabbix-proxy:
    image: zabbix/zabbix-proxy-sqlite3:alpine-7.0-latest
    environment:
      ZBX_SERVER_HOST: "${ZBX_SERVER_HOST}"
      ZBX_HOSTNAME: "${ZBX_HOSTNAME}"
      ZBX_PROXYMODE: "0"          # etkin mod: proxy merkeze kendisi bağlanır
    ports:
      - "10051:10051"             # yalnız müşteri yerel ağı — ajanlar buraya bildirir
    networks: [relay]
    restart: unless-stopped

  package-cache:
    image: nginx:alpine
    volumes:
      - ./package-cache/nginx.conf:/etc/nginx/nginx.conf:ro
      - package-data:/var/cache/packages
    ports: ["8081:80"]            # yalnız müşteri yerel ağı
    networks: [relay]
    restart: unless-stopped

volumes:
  redis-data:
  receptor-data:
  package-data:

networks:
  relay:
