# Paket önbelleği: 300 makine aynı kurulum dosyasını geniş alan ağından çekmez.
worker_processes auto;
events { worker_connections 1024; }

http {
  proxy_cache_path /var/cache/packages levels=1:2 keys_zone=pkg:100m max_size=40g
                   inactive=30d use_temp_path=off;

  server {
    listen 80;
    # yalnız müşterinin yerel ağı erişebilir
    allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16;
    deny all;

    location / {
      proxy_cache pkg;
      proxy_cache_valid 200 30d;
      proxy_cache_use_stale error timeout updating;
      proxy_pass https://packages.hisarresearch.com;
    }
  }
}
