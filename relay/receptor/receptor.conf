# AWX automation mesh — yürütme düğümü.
#
# Kritik iki ayar:
#   * listener yok            → düğüm gelen bağlantı DİNLEMEZ
#   * tcp-peer (giden)        → bağlantıyı düğüm kendisi kurar
# AWX tarafında bu düğüm `listener_port: null` ve `peers_from_control_nodes: false`
# ile kaydedilir. Böylece müşteri güvenlik duvarında gelen kural açılmaz.

- node:
    id: relay-${RELAY_TENANT}

- log-level: info

- tcp-peer:
    address: ${RECEPTOR_PEER}
    redial: true
    tls: mesh-client

- tls-client:
    name: mesh-client
    rootcas: /var/lib/receptor/tls/ca.crt
    cert: /var/lib/receptor/tls/relay.crt
    key: /var/lib/receptor/tls/relay.key

- control-service:
    service: control
    filename: /var/run/receptor/receptor.sock

- work-command:
    worktype: ansible-runner
    command: ansible-runner
    params: worker
    allowruntimeparams: true
